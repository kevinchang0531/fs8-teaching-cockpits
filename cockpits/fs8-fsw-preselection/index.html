<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>FS8 FSW PRESELECTION｜教學駕駛艙</title><link rel="stylesheet" href="./styles.css" /><link rel="stylesheet" href="./overrides.css" /></head><body>
<main class="cockpit-shell"><header class="topbar"><div class="brand"><span class="brand-mark">✦</span><div><p>FS8 FSW · LEARNING COCKPIT</p><h1>PRESELECTION 教學駕駛艙</h1></div></div><div class="mode-switch" role="group" aria-label="使用模式"><span>學習模式</span><button id="modeToggle" aria-pressed="false">學生模式</button></div></header><section class="hero-strip"><div><span class="eyebrow">自主學習任務</span><h2 id="focusTitle">預選構型的目的</h2><p id="focusSummary"></p></div><div class="progress-wrap"><div class="progress-label"><span>學習航程</span><span id="progressText">1 / 5</span></div><div class="progress-track"><span id="progressBar"></span></div></div></section><section class="focus-tabs" aria-label="教學重點"></section><section class="video-placeholder chalk-panel"><div class="panel-heading"><div><span class="panel-kicker">教學影片</span><h3>YouTube 教學影片預留區</h3></div><span>尚未嵌入</span></div><div class="video-stage"><img src="./assets/slide-01.jpg" alt="教學影片暫時圖片" /><div class="video-overlay"><strong>教學影片</strong><p>請提供 YouTube 教學影片的網址，我會更新此欄位。</p></div></div></section><section class="learning-grid"><article class="chalk-panel carousel-panel"><div class="panel-heading"><div><span class="panel-kicker">NOTEBOOKLM 簡報</span><h3>概念輪播</h3></div><span id="slideCount"></span></div><div class="slide-stage"><img id="slideImage" alt="PRESELECTION 教學簡報頁面" /></div><div class="carousel-controls"><button id="previousSlide" aria-label="上一張簡報">←</button><div id="slideDots"></div><button id="nextSlide" aria-label="下一張簡報">→</button></div></article><article class="chalk-panel visual-panel"><div class="panel-heading"><div><span class="panel-kicker">互動視覺化</span><h3 id="visualTitle"></h3></div><span class="live-dot">互動中</span></div><div class="orbit-visual" id="visualMap"></div><div class="visual-copy"><strong id="visualStepTitle"></strong><p id="visualStepCopy"></p></div></article><article class="chalk-panel quiz-panel"><div class="panel-heading"><div><span class="panel-kicker">形成性評量</span><h3>快速確認</h3></div><span id="quizStatus">尚未作答</span></div><div id="quizList" class="quiz-list"></div><div class="teacher-note" id="teacherNote"><strong>教師提示</strong><span></span></div></article><article class="chalk-panel infographic-panel"><div class="panel-heading"><div><span class="panel-kicker">資訊圖表</span><h3>關鍵概念一覽</h3></div><a id="downloadGraphic" download>下載 JPG ↗</a></div><img id="infographicImage" alt="教學重點資訊圖表" /></article></section></main>
<aside class="tool-dock" aria-label="教學工具面板"><div class="dock-title"><span>工具面板</span><button id="dockToggle" aria-label="收合工具面板">−</button></div><section class="tool-block"><h3>抽籤</h3><p id="pickedName">準備點名</p><button id="drawStudent">抽一位學生</button></section><section class="tool-block"><h3>計時器</h3><p id="timerDisplay" class="timer">02:00</p><div class="timer-buttons"><button id="timerStart">開始</button><button id="timerReset">重設</button></div></section></aside><aside class="pen-dock" aria-label="左側畫筆工具"><button id="penToggle" aria-expanded="false">✎ 畫筆</button><div id="penPanel" class="pen-panel"><span>粉筆顏色</span><div><button class="pen-color active" data-color="#f6df8b" aria-label="黃粉筆"></button><button class="pen-color" data-color="#9bc7e5" aria-label="藍粉筆"></button><button class="pen-color" data-color="#f4f0e8" aria-label="白粉筆"></button></div><button id="clearInk">清除筆跡</button></div></aside><canvas id="inkCanvas" aria-label="畫筆區域"></canvas><script src="./app.js"></script></body></html>
